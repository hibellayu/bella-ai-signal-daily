name: Daily AI Signal

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD (optional)"
        required: false
        type: string
  schedule:
    # Start at 06:30 Asia/Taipei so GitHub scheduling delays do not push publication past 07:00.
    - cron: "30 22 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate generation credentials
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY GitHub Secret is not configured."
            exit 1
          fi

      - name: Generate digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: |
          if [ -n "${{ inputs.report_date }}" ]; then
            python scripts/generate_daily_digest.py --report-date "${{ inputs.report_date }}"
          else
            python scripts/generate_daily_digest.py
          fi

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate daily AI signal"
          file_pattern: "data/digests/*.json daily sitemap.xml"
