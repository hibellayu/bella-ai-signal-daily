name: Daily AI Signal

on:
  workflow_dispatch:
  schedule:
    # 07:00 Asia/Taipei = 23:00 UTC
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate digest
        run: python scripts/generate_daily_digest.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate daily AI signal"
          file_pattern: data/digests/*.json
