name: Daily AI Signal Watchdog

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date in YYYY-MM-DD (optional)"
        required: false
        type: string
  schedule:
    # Fallback checks after the main 06:30 Asia/Taipei schedule.
    # If GitHub delays or drops the main schedule, this job publishes the missing daily digest.
    - cron: "30 23 * * *"
    - cron: "30 1 * * *"

permissions:
  contents: write

jobs:
  recover-missing-digest:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-ai-signal-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve report date
        id: report
        env:
          INPUT_REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$INPUT_REPORT_DATE" ]; then
            REPORT_DATE="$INPUT_REPORT_DATE"
          else
            REPORT_DATE="$(TZ=Asia/Taipei date +%F)"
          fi
          echo "date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          if [ -f "data/digests/$REPORT_DATE.json" ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when digest already exists
        if: steps.report.outputs.missing != 'true'
        run: |
          echo "Digest data/digests/${{ steps.report.outputs.date }}.json already exists; no recovery needed."

      - name: Set up Python
        if: steps.report.outputs.missing == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate generation credentials
        if: steps.report.outputs.missing == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY GitHub Secret is not configured."
            exit 1
          fi

      - name: Generate missing digest
        if: steps.report.outputs.missing == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          OPENAI_REWRITE_MODEL: ${{ vars.OPENAI_REWRITE_MODEL || 'gpt-4.1' }}
        run: |
          python scripts/generate_daily_digest.py --report-date "${{ steps.report.outputs.date }}"

      - name: Commit recovery changes
        if: steps.report.outputs.missing == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: recover missing daily AI signal"
          file_pattern: "index.html data/digests/*.json daily sitemap.xml"
